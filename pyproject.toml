[project]
name = "job-search"
version = "0.1.0"
description = ""
authors = [
    {name = "Davlystshina Victoria",email = "vika.davlyatshina@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "types-requests (>=2.32.4.20260107,<3.0.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
isort = "^7.0.0"
black = "^25.12.0"
flake8 = "^7.3.0"
mypy = "^1.19.1"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.0.0"

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
  /(
      \.eggs         # Исключить несколько общих каталогов
    | \.git          # в корне проекта
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py           # Также отдельно исключить файл с именем foo.py
                     # в корне проекта
)
'''

[tool.isort]
# максимальная длина строки
line_length = 119


[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true       # главная проверка: все функции должны иметь аннотации
warn_return_any = true             # если функция возвращает Any, предупреждать
strict_optional = true             # Optional/None проверяется

check_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true

warn_no_return = false
warn_unreachable = false
strict_equality = false

ignore_missing_imports = true

# Исключаем только виртуальные окружения
exclude = '''
^(\.venv|venv|env)/
'''
